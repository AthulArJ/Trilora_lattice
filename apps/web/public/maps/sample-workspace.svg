<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative operations workspace map</title>
  <desc id="desc">A generic, not-to-scale facility layout with operations, maintenance, logistics, staff areas, and illustrative positioning anchor locations.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0v24" stroke="#24363b" stroke-width="1"/></pattern>
    <pattern id="restricted" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0v9" stroke="#294044" stroke-width="2"/></pattern>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0b1519" flood-opacity=".08"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0 8 4 0 8z" fill="#68b6a4"/></marker>
  </defs>
  <rect width="1200" height="760" fill="#101d22"/><rect width="1200" height="760" fill="url(#grid)"/>
  <g font-family="Arial,sans-serif">
    <text x="62" y="48" fill="#8cc4b7" font-size="13" font-weight="700" letter-spacing="1.5">LATTICE  /  OPERATIONS WORKSPACE</text>
    <text x="62" y="76" fill="#e5efec" font-size="23" font-weight="700">Workspace operations · sample level 1</text>
    <text x="62" y="99" fill="#9aafac" font-size="12">Illustrative layout · not surveyed · not for navigation or live positioning</text>
    <g filter="url(#soft)" stroke="#496264" stroke-width="3" fill="#17282d">
      <rect x="58" y="128" width="1084" height="553" rx="8"/>
    </g>
    <!-- North public hall -->
    <g stroke="#354d50" stroke-width="2" fill="#20373b">
      <rect x="82" y="151" width="293" height="185" rx="4"/><rect x="385" y="151" width="242" height="185" rx="4"/>
      <rect x="637" y="151" width="198" height="185" rx="4"/><rect x="845" y="151" width="273" height="185" rx="4"/>
    </g>
    <g fill="#2b4548" stroke="#4a6365" stroke-width="1.5">
      <rect x="102" y="190" width="116" height="67" rx="5"/><rect x="230" y="190" width="124" height="67" rx="5"/>
      <rect x="103" y="272" width="251" height="43" rx="5"/>
      <rect x="405" y="188" width="202" height="44" rx="5"/><rect x="405" y="245" width="202" height="66" rx="5"/>
      <rect x="655" y="188" width="73" height="123" rx="5"/><rect x="741" y="188" width="74" height="55" rx="5"/><rect x="741" y="256" width="74" height="55" rx="5"/>
      <rect x="865" y="185" width="104" height="126" rx="5"/><rect x="983" y="185" width="113" height="57" rx="5"/><rect x="983" y="254" width="113" height="57" rx="5"/>
    </g>
    <!-- Main public circulation spine -->
    <rect x="82" y="348" width="1036" height="76" rx="5" fill="#17282d" stroke="#a9c5bf" stroke-width="2.5"/>
    <path d="M101 386h997" stroke="#3b7970" stroke-width="5" stroke-linecap="round" stroke-dasharray="3 13" opacity=".7"/>
    <path d="M135 386h105M963 386h105" stroke="#68b6a4" stroke-width="2" marker-end="url(#arrow)"/>
    <!-- South operational areas -->
    <g stroke="#354d50" stroke-width="2" fill="#20373b">
      <rect x="82" y="436" width="236" height="218" rx="4"/><rect x="328" y="436" width="259" height="218" rx="4"/>
      <rect x="597" y="436" width="260" height="218" rx="4"/><rect x="867" y="436" width="251" height="218" rx="4"/>
    </g>
    <g fill="#2b4548" stroke="#4a6365" stroke-width="1.5">
      <rect x="102" y="478" width="91" height="135" rx="5"/><rect x="205" y="478" width="92" height="135" rx="5"/>
      <rect x="348" y="478" width="102" height="67" rx="5"/><rect x="462" y="478" width="105" height="67" rx="5"/><rect x="348" y="558" width="219" height="55" rx="5"/>
      <rect x="618" y="478" width="104" height="135" rx="5"/><rect x="734" y="478" width="103" height="59" rx="5"/><rect x="734" y="548" width="103" height="65" rx="5"/>
      <rect x="888" y="478" width="102" height="59" rx="5"/><rect x="1002" y="478" width="96" height="59" rx="5"/><rect x="888" y="548" width="210" height="65" rx="5"/>
    </g>
    <!-- Labels -->
    <g fill="#a7c0bc" font-size="12" font-weight="700" letter-spacing="1.1">
      <text x="103" y="174">NORTH ZONE</text><text x="405" y="174">OPERATIONS ZONE</text><text x="656" y="174">STAFF ACCESS</text><text x="866" y="174">MAINTENANCE ZONE</text>
      <text x="103" y="369">PUBLIC CORRIDOR</text><text x="104" y="459">SOUTH ZONE</text><text x="350" y="459">FIELD OPERATIONS</text><text x="619" y="459">LOGISTICS ZONE</text><text x="889" y="459">FACILITIES</text>
    </g>
    <g fill="#839d99" font-size="10" font-weight="600">
      <text x="110" y="282">WORKSTATIONS</text><text x="415" y="271">INSPECTION AREA</text><text x="665" y="326">STAFF ROOM</text><text x="876" y="326">EQUIPMENT AREA</text>
      <text x="112" y="631">MATERIALS STORAGE</text><text x="356" y="633">SUPERVISOR / BREAK ROOM</text><text x="626" y="633">SERVICE DESK</text><text x="898" y="633">STORAGE / UTILITIES</text>
    </g>
    <!-- Entrance and exit cues -->
    <path d="M540 681v19m44-19v19" stroke="#3b8277" stroke-width="4" stroke-linecap="round"/><text x="562" y="721" text-anchor="middle" fill="#80bcaf" font-size="11" font-weight="700" letter-spacing="1">MAIN ENTRY</text>
    <path d="M1118 365h19m-19 42h19" stroke="#3b8277" stroke-width="4" stroke-linecap="round"/><text x="1112" y="357" text-anchor="end" fill="#80bcaf" font-size="10" font-weight="700">TO MAINTENANCE</text>
    <!-- Example anchors: visual placeholders only -->
    <g fill="#17282d" stroke="#328477" stroke-width="3">
      <circle cx="307" cy="386" r="10"/><circle cx="520" cy="386" r="10"/><circle cx="740" cy="386" r="10"/><circle cx="955" cy="386" r="10"/>
      <circle cx="455" cy="504" r="9"/><circle cx="738" cy="586" r="9"/>
    </g>
    <g fill="#328477"><circle cx="307" cy="386" r="3"/><circle cx="520" cy="386" r="3"/><circle cx="740" cy="386" r="3"/><circle cx="955" cy="386" r="3"/><circle cx="455" cy="504" r="3"/><circle cx="738" cy="586" r="3"/></g>
    <g fill="#83b7ac" font-size="9" font-weight="700"><text x="296" y="408">A1*</text><text x="509" y="408">A2*</text><text x="729" y="408">A3*</text><text x="944" y="408">A4*</text><text x="444" y="526">A5*</text><text x="727" y="608">A6*</text></g>
    <!-- North arrow and map legend -->
    <g transform="translate(1090 72)"><circle r="24" fill="#17282d" stroke="#41595b"/><path d="M0-14 6 7 0 3-6 7z" fill="#3b8277"/><text y="41" text-anchor="middle" fill="#a5bab5" font-size="10" font-weight="700">NORTH</text></g>
    <g transform="translate(78 739)" font-size="10" fill="#a5bbb5"><circle cx="5" cy="0" r="5" fill="#17282d" stroke="#328477" stroke-width="2"/><text x="17" y="4">* SAMPLE ANCHOR LOCATION · NOT SURVEYED</text><rect x="300" y="-6" width="12" height="12" rx="2" fill="#2b4548" stroke="#4a6365"/><text x="320" y="4">ILLUSTRATIVE AREA</text><text x="1080" y="4" text-anchor="end" letter-spacing="1">SCHEMATIC · NO SCALE</text></g>
  </g>
</svg>
