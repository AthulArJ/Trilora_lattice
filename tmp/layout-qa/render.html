/* Dashboard alignment and type polish */
.content-grid > .panel {
  min-width: 0;
}
.metric-head {
  font-size: 12px;
  line-height: 1.35;
}
.metric-sub {
  font-size: 12px;
  line-height: 1.4;
}
.panel-heading h2 {
  line-height: 1.3;
}
.panel-heading p {
  line-height: 1.45;
}
.people-toolbar .search-box,
.people-toolbar .filter-button {
  min-height: 34px;
  font-size: 12px;
}
.people-table .table-head {
  font-size: 12px;
  line-height: 1.3;
}
.people-table .person-row {
  min-height: 48px;
  font-size: 12px;
}
.people-table .person-name small,
.people-table .last-update,
.people-table .status-copy {
  font-size: 12px;
}
.activity-panel {
  display: flex;
  flex-direction: column;
  min-height: 239px;
}
.activity-panel .panel-heading {
  flex: none;
  padding: 17px 18px 12px;
}
.activity-panel .timeline {
  display: flex;
  flex: 1 1 auto;
  flex-direction: column;
  min-height: 0;
  padding: 3px 16px 8px;
}
.activity-panel .activity-item {
  display: grid;
  grid-template-columns: 28px minmax(0, 1fr) auto;
  align-items: center;
  flex: 1 1 52px;
  min-height: 52px;
  gap: 10px;
  padding: 6px 0;
  border-bottom: 1px solid #eef2f0;
}
.activity-panel .activity-item:last-child {
  border-bottom: 0;
}
.activity-panel .activity-item:after {
  display: none;
}
.activity-panel .activity-icon {
  width: 28px;
  height: 28px;
  flex: none;
}
.activity-panel .activity-copy {
  min-width: 0;
  gap: 3px;
  line-height: 1.35;
}
.activity-panel .activity-copy b {
  overflow: hidden;
  color: #344a44;
  font-size: 12px;
  font-weight: 650;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.activity-panel .activity-copy span {
  overflow: hidden;
  color: #84928d;
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.activity-panel .activity-item time {
  align-self: start;
  padding-top: 8px;
  color: #87948f;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
}
.activity-panel .table-footer {
  flex: none;
  min-height: 40px;
  height: auto;
  margin-top: auto;
  font-size: 12px;
}
@media (max-width: 850px) {
  .activity-panel .timeline {
    display: grid;
    flex: none;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 0 16px;
  }
  .activity-panel .activity-item {
    min-height: 58px;
  }
}
@media (max-width: 600px) {
  .activity-panel .timeline {
    grid-template-columns: 1fr;
    padding: 3px 12px 8px;
  }
  .activity-panel .activity-item {
    min-height: 56px;
  }
  .people-table .person-row {
    min-height: 44px;
  }
}

.operations-hub-standalone {
    min-height: 100vh;
    background: radial-gradient(ellipse at 52% -18%, #1d3a37 0%, #0d2022 42%, #081416 78%);
    color: #edf5f1
}

.operations-hub {
    --bg: #081416;
    --surface: #0f2023;
    --surface-raised: #13272a;
    --line: #263b3d;
    --text: #edf5f1;
    --muted: #8ba19c;
    --teal: #62d2b3;
    display: flex;
    flex-direction: column;
    gap: 18px;
    box-sizing: border-box;
    width: 100%;
    max-width: none;
    margin: 0 auto;
    padding: 0 24px 30px;
    color: var(--text);
    font-family: Inter, "Segoe UI", sans-serif
}

.briefing-header {
    min-height: 66px;
    display: flex;
    align-items: center;
    gap: 30px;
    border-bottom: 1px solid #233537
}

.briefing-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #eaf4ef;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: .14em
}

.briefing-brand img {
    width: 39px;
    height: 37px;
    object-fit: contain
}

.briefing-brand small,
.briefing-location small {
    display: block;
    margin-top: 4px;
    color: #819994;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .17em
}

.briefing-location {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #72cdb1
}

.briefing-location b {
    color: #e7f0ec;
    font-size: 12px;
    letter-spacing: .1em
}

.briefing-location small {
    font-size: 12px
}

.briefing-header-actions {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-left: auto
}

.briefing-source,
.briefing-data-tag {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 7px 10px;
    border: 1px solid #364444;
    border-radius: 99px;
    background: #182628;
    color: #d2dcd8;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .08em
}

.briefing-source i,
.briefing-data-tag i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #d0ad66
}

.briefing-source.is-live,
.briefing-data-tag.is-live {
    border-color: #285342;
    background: #122a23;
    color: #85e1bd
}

.briefing-source.is-live i,
.briefing-data-tag.is-live i {
    background: #61d8ae;
    box-shadow: 0 0 0 3px #61d8ae22
}

.briefing-source.is-demo {
    border-color: #6d5433;
    background: #2d261a;
    color: #e5bd73
}

.briefing-source.is-demo i {
    background: #e5ae56
}

.briefing-user {
    display: grid;
    place-items: center;
    width: 34px;
    height: 34px;
    border: 1px solid #36504e;
    border-radius: 50%;
    background: #193331;
    color: #aee8d4;
    font-size: 12px;
    font-weight: 800
}

.briefing-signout {
    display: grid;
    place-items: center;
    width: 32px;
    height: 32px;
    border: 1px solid #2b3e40;
    border-radius: 9px;
    background: #122326;
    color: #a7bbb5;
    cursor: pointer
}

.briefing-hero {
    position: relative;
    min-height: 238px;
    display: flex;
    align-items: center;
    overflow: hidden;
    border: 1px solid #36504b;
    border-radius: 18px;
    background: #102424;
    box-shadow: 0 18px 50px #0003
}

.briefing-hero>img {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 53%;
    opacity: .72
}

.briefing-hero-shade {
    position: absolute;
    inset: 0;
    background: linear-gradient(90deg, #091a1cf5 0%, #0b1b1cdc 39%, #0c1c1d80 72%, #08171850), linear-gradient(0deg, #071718aa, transparent 45%)
}

.briefing-hero-content {
    position: relative;
    z-index: 1;
    max-width: 760px;
    padding: 30px 34px
}

.briefing-date {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #9fc5b8;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .16em
}

.briefing-date span {
    width: 24px;
    height: 1px;
    background: #62d2b3
}

.briefing-hero h1 {
    margin: 13px 0 5px;
    color: #f1f5ee;
    font-size: clamp(28px, 3vw, 42px);
    font-weight: 680;
    letter-spacing: -.055em
}

.briefing-hero-content>p {
    margin: 0;
    color: #c0d0c9;
    font-size: 12px
}

.briefing-live-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 17px;
    margin-top: 22px;
    color: #b1c4bd;
    font-size: 12px
}

.briefing-live-meta>span {
    display: inline-flex;
    align-items: center;
    gap: 6px
}

.briefing-live-meta svg {
    color: #7ac9ad
}

.briefing-live-meta i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #d4aa57
}

.briefing-live-meta i.is-live {
    background: #61d8ae;
    box-shadow: 0 0 0 3px #61d8ae25
}

.briefing-overview-link {
    position: absolute;
    z-index: 2;
    right: 22px;
    bottom: 21px;
    display: flex;
    align-items: center;
    gap: 17px;
    min-width: 238px;
    padding: 13px 15px;
    border: 1px solid #62847a88;
    border-radius: 12px;
    background: #102625df;
    color: #c8e5d9;
    text-align: left;
    backdrop-filter: blur(9px);
    cursor: pointer;
    transition: transform .18s, border-color .18s, background .18s
}

.briefing-overview-link:hover {
    transform: translateY(-2px);
    border-color: #7fd4b5;
    background: #15322d
}

.briefing-overview-link>span {
    flex: 1
}

.briefing-overview-link small,
.briefing-overview-link b,
.briefing-overview-link em {
    display: block
}

.briefing-overview-link small {
    color: #88b9a8;
    font-size: 12px;
    font-weight: 800;
    letter-spacing: .13em
}

.briefing-overview-link b {
    margin-top: 4px;
    color: #f1f6f2;
    font-size: 12px
}

.briefing-overview-link em {
    margin-top: 3px;
    color: #9fb5ad;
    font-size: 12px;
    font-style: normal
}

.briefing-actions {
    display: flex;
    flex-wrap: wrap;
    gap: 8px
}

.briefing-actions button,
.briefing-card-head>button {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 35px;
    padding: 0 12px;
    border: 1px solid #304447;
    border-radius: 8px;
    background: #122326;
    color: #b9cdc5;
    font: inherit;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: background .15s, border-color .15s, color .15s
}

.briefing-actions button:hover,
.briefing-card-head>button:hover {
    border-color: #4f8b79;
    background: #19302d;
    color: #e4f5ed
}

.briefing-actions .action-issue {
    border-color: #327761;
    background: #23735e;
    color: #fff
}

.briefing-actions .action-issue:hover {
    background: #2d8c70
}

.briefing-actions .action-refresh {
    margin-left: auto
}

.briefing-actions .action-refresh span {
    display: inline
}

.briefing-kpis {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px
}

.briefing-kpi {
    position: relative;
    min-height: 132px;
    padding: 16px 17px 15px;
    overflow: hidden;
    border: 1px solid #2b4142;
    border-radius: 13px;
    background: linear-gradient(145deg, #14282a, #101f22 78%);
    box-shadow: 0 8px 24px #0002
}

.briefing-kpi:before {
    position: absolute;
    inset: 0 auto 0 0;
    width: 3px;
    background: #62d2b3;
    content: ""
}

.briefing-kpi.positioning:before {
    background: #61b9df
}

.briefing-kpi.safety:before {
    background: #e18368
}

.briefing-kpi.infrastructure:before {
    background: #b39ae8
}

.briefing-kpi>span {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #92aaa4;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: .13em
}

.briefing-kpi.workforce>span svg {
    color: #68d6b5
}

.briefing-kpi.positioning>span svg {
    color: #72c1e2
}

.briefing-kpi.safety>span svg {
    color: #e98a73
}

.briefing-kpi.infrastructure>span svg {
    color: #b5a1e8
}

.briefing-kpi>strong {
    display: block;
    margin-top: 13px;
    color: #f2f7f4;
    font-size: 30px;
    line-height: 1;
    font-weight: 750;
    letter-spacing: -.05em
}

.briefing-kpi>b {
    display: block;
    margin-top: 5px;
    color: #dce8e3;
    font-size: 12px
}

.briefing-kpi>small {
    display: block;
    margin-top: 5px;
    color: #819994;
    font-size: 12px;
    line-height: 1.4
}

.briefing-kpi.safety.has-alert {
    border-color: #80463f;
    background: linear-gradient(145deg, #321f1e, #151f21 82%);
    animation: sos-border 1.8s ease-in-out infinite
}

.briefing-kpi.safety.has-alert:before {
    background: #ff705c
}

@keyframes sos-border {
    50% {
        box-shadow: 0 0 0 3px #f36e5630, 0 8px 26px #0003
    }
}

.briefing-section-heading {
    display: flex;
    align-items: end;
    justify-content: space-between;
    gap: 18px;
    margin: 2px 1px -2px
}

.briefing-section-heading>div>span {
    color: #68bba2;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: .18em
}

.briefing-section-heading h2 {
    margin: 5px 0 0;
    color: #edf4ef;
    font-size: 21px;
    letter-spacing: -.04em
}

.briefing-section-heading>p {
    margin: 0 2px 3px;
    color: #819995;
    font-size: 12px
}

.briefing-grid {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    align-items: stretch;
    gap: 13px
}

.briefing-card {
    min-width: 0;
    min-height: 270px;
    padding: 18px;
    border: 1px solid #293e40;
    border-radius: 14px;
    background: linear-gradient(145deg, #122326, #101d20 78%);
    box-shadow: 0 10px 27px #0002
}

.workforce-card {
    grid-column: span 7
}

.safety-card {
    grid-column: span 5

        grid-template-columns: repeat(2, minmax(0, 1fr))
    }

    .workforce-card,
    .safety-card,
    .trend-card,
    .tickets-card {
        grid-column: span 6
    }

    .zone-summary-list {
        grid-template-columns: repeat(2, minmax(0, 1fr))
    }
}

@media(max-width:700px) {
    .operations-hub {
        gap: 13px;
        padding: 0 12px 22px
    }

    .briefing-header {
        min-height: 56px;
        gap: 12px
    }

    .briefing-brand {
        font-size: 12px
    }

    .briefing-brand img {
        width: 31px;
        height: 30px
    }

    .briefing-brand small {
        font-size: 12px
    }

    .briefing-location {
        display: none
    }

    .briefing-source {
        max-width: 170px;
        overflow: hidden;
        padding: 6px 8px;
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap
    }

    .briefing-user {
        width: 29px;
        height: 29px
    }

    .briefing-hero {
        min-height: 320px;
        align-items: flex-start
    }

    .briefing-hero>img {
        object-position: 60% center
    }

    .briefing-hero-shade {
        background: linear-gradient(90deg, #091a1cf2, #0b1b1dbb 75%, #0c1c1d65), linear-gradient(0deg, #071718cc, transparent 65%)
    }

    .briefing-hero-content {
        padding: 24px 20px 125px
    }

    .briefing-date {
        font-size: 12px;
        letter-spacing: .1em
    }

    .briefing-hero h1 {
        font-size: 30px
    }

    .briefing-hero-content>p {
        max-width: 290px;
        font-size: 12px;
        line-height: 1.5
    }

    .briefing-live-meta {
        display: grid;
        gap: 8px;
        margin-top: 15px;
        font-size: 12px
    }

    .briefing-overview-link {
        right: 12px;
        bottom: 12px;
        left: 12px;
        min-width: 0;
        padding: 10px 12px
    }

    .briefing-actions {
        display: grid;
        grid-template-columns: 1fr 1fr
    }

    .briefing-actions button {
        min-height: 39px;
        padding-inline: 7px;
        font-size: 12px
    }

    .briefing-actions .action-refresh {
        margin-left: 0
    }

    .briefing-kpis {
        gap: 8px
    }

    .briefing-kpi {
        min-height: 122px;
        padding: 12px
    }

    .briefing-kpi>span {
        font-size: 12px;
        letter-spacing: .09em
    }

    .briefing-kpi>strong {
        font-size: 25px
    }

    .briefing-kpi>b {
        font-size: 12px
    }

    .briefing-kpi>small {
        font-size: 12px
    }

    .briefing-section-heading {
        align-items: flex-start;
        flex-direction: column;
        gap: 5px
    }

    .briefing-section-heading h2 {
        font-size: 19px
    }

    .briefing-section-heading>p {
        font-size: 12px
    }

    .briefing-grid {
        grid-template-columns: 1fr;
        gap: 10px
    }

    .workforce-card,
    .safety-card,
    .trend-card,
    .tickets-card,
    .shifts-card,
    .anchors-card,
    .zones-card {
        grid-column: auto;
        min-height: unset;
        padding: 14px
    }

    .briefing-card-head h3 {
        font-size: 14px
    }

    .briefing-card-head p {
        font-size: 12px
    }

    .briefing-card-head>button {
        min-height: 28px;
        padding-inline: 7px;
        font-size: 12px
    }

    .workforce-visual {
        grid-template-columns: 105px minmax(0, 1fr);
        gap: 12px;
        margin-top: 15px
    }

    .workforce-donut {
        width: 100px
    }

    .workforce-donut:before {
        inset: 9px
    }

    .workforce-donut b {
        font-size: 21px
    }

    .workforce-category {
        grid-template-columns: minmax(75px, 1fr) minmax(25px, .8fr) 19px 27px;
        gap: 5px;
        font-size: 12px
    }

    .category-label {
        gap: 4px
    }

    .category-label>i {
        width: 6px;
        height: 6px
    }

    .workforce-category>small {
        font-size: 12px
    }

    .briefing-mini-stats {
        gap: 6px;
        margin-top: 12px
    }

    .briefing-mini-stats>div {
        padding: 8px
    }

    .briefing-mini-stats b {
        font-size: 16px
    }

    .briefing-mini-stats small {
        font-size: 12px
    }

    .trend-chart {
        margin-top: 13px
    }

    .trend-chart svg {
        height: 125px
    }

    .trend-foot {
        gap: 12px;
        font-size: 12px
    }

    .briefing-ticket-row {
        gap: 7px
    }

    .briefing-ticket-row b {
        font-size: 12px
    }

    .briefing-ticket-row small {
        font-size: 12px
    }

    .briefing-ticket-row select {
        max-width: 88px
    }

    .zone-summary-list {
        grid-template-columns: 1fr
    }

    .briefing-footnote {
        display: grid;
        gap: 7px
    }

    .briefing-footnote>span:last-child {
        text-align: left
    }

    .hub-modal {
        padding: 16px
    }

    .hub-form-row {
        grid-template-columns: 1fr 1fr
    }
}

@media(max-width:380px) {
    .briefing-kpis {
        grid-template-columns: 1fr 1fr
    }

    .workforce-visual {
        grid-template-columns: 1fr
    }

    .workforce-donut {
        width: 115px
    }

    .workforce-category {
        grid-template-columns: minmax(84px, 1fr) minmax(35px, 1fr) 20px 28px
    }

    .briefing-card-head {
        gap: 7px
    }

    .briefing-card-head>button {
        font-size: 12px
    }
}

@media(prefers-reduced-motion:reduce) {

    *,
    *::before,
    *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important
    }
}

/* Workforce Intelligence: an animated in-Hub drilldown, independent of the dashboard shell. */
.workforce-intel-screen {
    min-height: 100vh;
    padding: 0 26px 35px;
    background: radial-gradient(ellipse at 20% 0%, #173936 0%, transparent 38%), radial-gradient(ellipse at 100% 45%, #152a39 0%, transparent 35%), linear-gradient(145deg, #081416, #0a191c 62%, #091417)
}

.wi-topbar {
    position: relative;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    min-height: 72px;
    max-width: 1500px;
    margin: auto;
    border-bottom: 1px solid #294142
}

.wi-back {
    justify-self: start;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 11px;
    border: 1px solid #34504d;
    border-radius: 9px;
    background: #132628;
    color: #b8d5ca;
    font: inherit;
    font-size: 12px;
    font-weight: 750;
    cursor: pointer;
    transition: background .16s, border-color .16s
}

.wi-back:hover {
    border-color: #59b798;
    background: #183431
}

.wi-back svg {
    transform: rotate(180deg)
}

.wi-top-brand {
    display: flex;
    align-items: center;
    gap: 9px;
    color: #eff6f2;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: .15em
}

.wi-top-brand img {
    width: 34px;
    height: 32px;
    object-fit: contain
}

.wi-top-brand small {
    display: block;
    margin-top: 4px;
    color: #76bda6;
    font-size: 12px;
    letter-spacing: .16em
}

.wi-topbar>.briefing-source {
    justify-self: end
}

.wi-main {
    max-width: 1448px;
    margin: 0 auto
}

.wi-hero {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    min-height: 210px;
    margin: 23px 0 14px;
    padding: 28px 32px;
    overflow: hidden;
    border: 1px solid #375651;
    border-radius: 18px;
    background: linear-gradient(115deg, #122724 0%, #163333 56%, #172d36 100%);
    box-shadow: 0 20px 45px #0003;
    animation: wi-rise .48s cubic-bezier(.2, .7, .2, 1) both
}

.wi-hero:after {
    position: absolute;
    right: 15%;
    top: -105px;
    width: 330px;
    height: 330px;
    border: 1px solid #8ad7ba24;
    border-radius: 50%;
    box-shadow: 0 0 0 36px #8ad7ba08, 0 0 0 74px #8ad7ba06;
    content: "";
    pointer-events: none
}

.wi-hero>div:first-child {
    position: relative;
    z-index: 1;
    max-width: 730px
}

.wi-eyebrow {
    display: flex;
    align-items: center;
    gap: 8px;
    color: #84d8b8;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: .17em
}

.wi-eyebrow i {
    width: 20px;
    height: 1px;
    background: #5cc8a5
}

.wi-hero h1 {
    margin: 12px 0 7px;
    color: #f3f7f2;
    font-size: clamp(30px, 4vw, 47px);
    letter-spacing: -.06em;
    font-weight: 700
}

.wi-hero h1 em {
    color: #9fe2c6;
    font-family: Georgia, serif;
    font-weight: 500
}

.wi-hero p {
    max-width: 620px;
    margin: 0;
    color: #b4c9c0;
    font-size: 12px;
    line-height: 1.6
}

.wi-data-boundary {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 15px;
    color: #9bb5ab;
    font-size: 12px
}

.wi-data-boundary svg {
    color: #a9c68a;
    flex: none
}

.wi-hero-total {
    position: relative;
    z-index: 1;
    display: grid;
    justify-items: end;
    min-width: 210px;
    padding-left: 25px;
    border-left: 1px solid #65847955
}

.wi-hero-total small {
    color: #98cdb8;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: .15em
}

.wi-hero-total b {
    margin: 5px 0;
    color: #f5f8f4;
    font-size: 58px;
    line-height: 1;
    font-weight: 700;
    letter-spacing: -.07em
}

.wi-hero-total span {
    color: #a6bdb4;
    font-size: 12px
}

.wi-kpis {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 13px
}

.wi-kpis article {
    position: relative;
    display: grid;
    grid-template-columns: 38px 1fr;
    grid-template-rows: auto auto auto;
    align-items: center;
    column-gap: 10px;
    min-height: 108px;
    padding: 14px;
    border: 1px solid #2a4142;
    border-radius: 12px;
    background: linear-gradient(145deg, #122427, #102023);
    animation: wi-rise .45s cubic-bezier(.2, .7, .2, 1) both;
    animation-delay: var(--wi-delay, 0ms)
}

.wi-kpis article:nth-child(2) {
    --wi-delay: 65ms
}

.wi-kpis article:nth-child(3) {
    --wi-delay: 130ms
}

.wi-kpis article:nth-child(4) {
    --wi-delay: 195ms
}

.wi-kpi-icon {
    grid-row: 1/4;
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    border-radius: 11px
}

.wi-kpi-icon.teal {
    background: #173b34;
    color: #72dfb9
}

.wi-kpi-icon.violet {
    background: #302b45;
    color: #c0a9f0
}

.wi-kpi-icon.blue {
    background: #1c3542;
    color: #79c5e6
}

.wi-kpi-icon.amber {
    background: #3b3222;
    color: #e8be70
}

.wi-kpis article>small {
    color: #8ea9a1;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: .12em
}

.wi-kpis article>b {
    margin-top: 3px;
    color: #f0f5f1;
    font-size: 24px;
    line-height: 1;
    letter-spacing: -.04em
}

.wi-kpis article>b i {
    color: #829a93;
    font-size: 12px;
    font-style: normal;
    font-weight: 600
}

.wi-kpis article>em {
    margin-top: 4px;
    color: #8ba19a;
    font-size: 12px;
    font-style: normal
}

.wi-analytics {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    gap: 12px
}

.wi-panel {
    min-width: 0;
    padding: 19px;
    border: 1px solid #293f40;
    border-radius: 14px;
    background: linear-gradient(150deg, #122326, #0f1e21);
    box-shadow: 0 12px 30px #0002;
    animation: wi-rise .5s cubic-bezier(.2, .7, .2, 1) both;
    animation-delay: 220ms
}

.wi-composition-panel {
    grid-column: span 7
}

.wi-readiness-panel {
    grid-column: span 5
}

.wi-shift-panel {
    grid-column: span 5
}

.wi-register-panel {
    grid-column: span 7
}

.wi-panel-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 13px
}

.wi-panel-head>div>span {
    color: #76c6aa;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: .15em
}

.wi-panel-head h2 {
    margin: 6px 0 4px;
    color: #eef5f0;
    font-size: 16px;
    letter-spacing: -.03em
}

.wi-panel-head p {
    margin: 0;
    color: #849b95;
    font-size: 12px;
    line-height: 1.5
}

.wi-period-chip,
.wi-current-view {
    flex: none;
    padding: 6px 8px;
    border: 1px solid #334947;
    border-radius: 99px;
    background: #172a2b;
    color: #a4c7b8;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: .1em
}

.wi-composition-layout {
    display: grid;
    grid-template-columns: minmax(135px, .66fr) minmax(0, 1.34fr);
    align-items: center;
    gap: 18px;
    margin-top: 17px
}

.wi-donut {
    position: relative;
    display: block;
    aspect-ratio: 1;
    background: none;
    box-shadow: none;
    animation: none
}

.wi-donut>div {
    position: absolute;
    inset: 0;
    z-index: 1;
    text-align: center
}

.wi-donut b,
.wi-donut small {
    display: block
}

.wi-donut b {
    color: #f1f6f2;
    font-size: 29px;
    line-height: 1
}

.wi-donut small {
    margin-top: 5px;
    color: #89a69d;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: .16em
}

.wi-bars {
    display: grid;
    gap: 5px
}

.wi-bar-row {
    display: grid;
    grid-template-columns: minmax(105px, 1fr) minmax(45px, 1.3fr) 25px 32px;
    align-items: center;
    gap: 8px;
    min-height: 25px;
    padding: 3px 6px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: #b5c7c0;
    text-align: left;
    font: inherit;
    cursor: pointer;
    transition: background .18s, border-color .18s, transform .18s
}

.wi-bar-row:hover {
    transform: translateX(3px);
    background: #1a302f
}

.wi-bar-row.selected {
    border-color: #4d9c80;
    background: #18342e
}

.wi-bar-label {
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
    overflow: hidden;
    font-size: 12px;
    text-overflow: ellipsis;
    white-space: nowrap
}

.wi-bar-label>i {
    width: 7px;
    height: 7px;
    flex: none;
    border-radius: 50%
}

.wi-bar-track {
    height: 5px;
    overflow: hidden;
    border-radius: 99px;
    background: #263a3c
}

.wi-bar-track>i {
    display: block;
    height: 100%;
    border-radius: inherit;
    transform-origin: left;
    animation: wi-bar-in .8s cubic-bezier(.18, .75, .22, 1) both
}

.wi-bar-row>b {
    text-align: right;
    color: #edf4f0;
    font-size: 12px
}

.wi-bar-row>small {
    text-align: right;
    color: #819a92;
    font-size: 12px
}

.wi-chart-foot {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-top: 13px;
    padding-top: 10px;
    border-top: 1px solid #293c3e;
    color: #849b94;
    font-size: 12px
}

.wi-chart-foot>span {
    display: flex;
    align-items: center;
    gap: 6px
}

.wi-chart-foot>span>i {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #62d2b3
}

.wi-chart-foot button {
    border: 0;
    background: transparent;
    color: #92cfb6;
    font: inherit;
    cursor: pointer
}

.wi-readiness-list {
    display: grid;
    gap: 2px;
    margin-top: 13px
}

.wi-readiness-list>div {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 0;
    border-bottom: 1px solid #293a3c
}

.wi-readiness-list>div:last-child {
    border: 0
}

.wi-readiness-icon {
    display: grid;
    place-items: center;
    width: 30px;
    height: 30px;
    flex: none;
    border-radius: 9px
}

.wi-readiness-icon.assigned {
    background: #17362e;
    color: #6ed0ab
}

.wi-readiness-icon.reporting {
    background: #1a3440;
    color: #78c7e6
}

.wi-readiness-icon.low {
    background: #392f20;
    color: #e4b866
}

.wi-readiness-icon.offline {
    background: #382420;
    color: #ea8c75
}

.wi-readiness-list>div>span:nth-child(2) {
    flex: 1;
    min-width: 0
}

.wi-readiness-list b,
.wi-readiness-list small {
    display: block
}

.wi-readiness-list b {
    color: #e2ece7;
    font-size: 12px
}

.wi-readiness-list small {
    margin-top: 3px;
    color: #819993;
    font-size: 12px
}

.wi-readiness-list strong {
    color: #edf5f0;
    font-size: 14px
}

.wi-readiness-list strong i {
    color: #849b94;
    font-size: 12px;
    font-style: normal
}

.wi-device-note {
    display: flex;
    align-items: center;
    gap: 7px;
    margin-top: 11px;
    padding: 9px;
    border-radius: 8px;
    background: #172827;
    color: #99b9ad;
    font-size: 12px
}

.wi-device-note svg {
    flex: none;
    color: #91c5ab
}

.wi-shift-panel>.wi-panel-head>button,
.wi-register-head>button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 7px 9px;
    border: 1px solid #36514a;
    border-radius: 8px;
    background: #172c2b;
    color: #b8d9ca;
    font: inherit;
    font-size: 12px;
    font-weight: 750;
    white-space: nowrap;
    cursor: pointer
}

.wi-shift-stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 7px;
    margin-top: 14px
}

.wi-shift-stats>div {
    padding: 11px;
    border: 1px solid #2d4241;
    border-radius: 9px;
    background: #162a2b
}

.wi-shift-stats b,
.wi-shift-stats small {
    display: block
}

.wi-shift-stats b {
    color: #edf5f0;
    font-size: 20px
}

.wi-shift-stats small {
    margin-top: 4px;
    color: #89a29a;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: .1em
}

.wi-shift-groups {
    display: grid;
    gap: 6px;
    margin-top: 12px
}

.wi-shift-groups>div {
    display: grid;
    grid-template-columns: 1fr 30px 65px;
    align-items: center;
    gap: 8px;
    padding: 7px 3px;
    border-top: 1px solid #293a3c
}

.wi-shift-groups>div>span {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #b6c8c1;
    font-size: 12px
}

.wi-shift-groups>div>span i {
    width: 7px;
    height: 7px;
    border-radius: 50%
}

.wi-shift-groups b {
    color: #e7efeb;
    font-size: 12px;
    text-align: right
}

.wi-shift-groups small {
    color: #87a198;
    font-size: 12px;
    text-align: right
}

.wi-empty {
    display: grid;
    justify-items: center;
    gap: 8px;
    min-height: 165px;
    align-content: center;
    margin-top: 13px;
    padding: 18px;
    border: 1px dashed #38504c;
    border-radius: 10px;
    background: #142526;
    color: #6ac8a5;
    text-align: center
}

.wi-empty b {
    color: #e1ece6;
    font-size: 12px
}

.wi-empty>span {
    max-width: 330px;
    color: #8aa19a;
    font-size: 12px;
    line-height: 1.5
}

.wi-empty button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 3px;
    padding: 8px 10px;
    border: 1px solid #3f705f;
    border-radius: 8px;
    background: #1c4236;
    color: #c7f0dc;
    font: inherit;
    font-size: 12px;
    font-weight: 800;
    cursor: pointer
}

.wi-register-panel {
    min-height: 300px
}

.wi-register-head {
    align-items: center
}

.wi-filters {
    display: flex;
    gap: 8px;

/* Workforce intelligence: department command board (distinct from the hub summary chart) */
.wi-composition-panel {
    grid-column: span 12;
    padding: 22px;
    background: radial-gradient(ellipse at 8% 100%, #1c433533, transparent 38%), linear-gradient(145deg, #14282a, #101e21 70%)
}

.wi-composition-panel .wi-panel-head {
    align-items: center;
    margin-bottom: 18px
}

.wi-composition-panel .wi-panel-head h2 {
    font-size: 20px
}

.wi-composition-panel .wi-panel-head p {
    font-size: 12px
}

.wi-team-board {
    display: grid;
    grid-template-columns: repeat(5, minmax(0, 1fr));
    gap: 10px
}

.wi-team-tile {
    --team-color: #56d5b3;
    position: relative;
    display: flex;
    min-height: 142px;
    flex-direction: column;
    align-items: flex-start;
    overflow: hidden;
    padding: 13px;
    border: 1px solid #2b4141;
    border-radius: 12px;
    background: linear-gradient(145deg, #17292b, #132225);
    color: #e9f1ed;
    text-align: left;
    font: inherit;
    cursor: pointer;
    isolation: isolate;
    transition: transform .22s cubic-bezier(.2, .8, .2, 1), border-color .22s, background .22s, box-shadow .22s;
    animation: wi-tile-in .55s cubic-bezier(.2, .75, .2, 1) both;
    animation-delay: calc(90ms + var(--team-order)*45ms)
}

.wi-team-tile:before {
    position: absolute;
    z-index: -1;
    right: -30px;
    bottom: -44px;
    width: 115px;
    height: 115px;
    border-radius: 50%;
    background: var(--team-color);
    opacity: 0;
    filter: blur(35px);
    content: "";
    transition: opacity .25s
}

.wi-team-tile:hover {
    transform: translateY(-3px);
    border-color: color-mix(in srgb, var(--team-color), #263c3c 36%);
    box-shadow: 0 12px 28px #0003
}

.wi-team-tile:hover:before,
.wi-team-tile.has-people:before {
    opacity: .12
}

.wi-team-tile.selected {
    border-color: var(--team-color);
    background: linear-gradient(145deg, color-mix(in srgb, var(--team-color), #142527 88%), #132326);
    box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--team-color), transparent 72%), 0 0 22px color-mix(in srgb, var(--team-color), transparent 89%)
}

.wi-team-top {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between
}

.wi-team-top>i {
    color: #7d9690;
    font-size: 12px;
    font-style: normal;
    font-weight: 850;
    letter-spacing: .12em
}

.wi-team-signal {
    width: 7px;
    height: 7px;
    border: 1px solid #566965;
    border-radius: 50%;
    background: #52615f
}

.wi-team-tile.has-people .wi-team-signal {
    border-color: var(--team-color);
    background: var(--team-color);
    box-shadow: 0 0 11px var(--team-color);
    animation: wi-signal 2.2s ease-in-out infinite
}

.wi-team-name {
    margin-top: 12px;
    color: #bdcec8;
    font-size: 12px;
    font-weight: 750;
    line-height: 1.25
}

.wi-team-tile strong {
    margin-top: auto;
    color: #f3f7f3;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -.06em;
    line-height: 1
}

.wi-team-tile.has-people strong {
    color: var(--team-color)
}

.wi-team-meta {
    margin-top: 5px;
    color: #829b94;
    font-size: 12px;
    font-weight: 850;
    letter-spacing: .1em
}

.wi-team-people {
    display: flex;
    align-items: center;
    gap: 5px;
    margin-top: 10px;
    color: #91a79f;
    font-size: 12px
}

.wi-team-people svg {
    color: var(--team-color)
}

.wi-team-tile:not(.has-people) .wi-team-people {
    opacity: .72
}

@keyframes wi-tile-in {
    from {
        opacity: 0;
        transform: translateY(12px) scale(.98)
    }

    to {
        opacity: 1;
        transform: translateY(0) scale(1)
    }
}

@keyframes wi-signal {

    0%,
    100% {
        box-shadow: 0 0 5px color-mix(in srgb, var(--team-color), transparent 35%)
    }

    50% {
        box-shadow: 0 0 13px var(--team-color)
    }
}

@media(max-width:1050px) {
    .wi-composition-panel {
        grid-column: span 12
    }

    .wi-team-board {
        grid-template-columns: repeat(5, minmax(0, 1fr))
    }
}

@media(max-width:700px) {
    .wi-composition-panel {
        grid-column: auto;
        padding: 14px
    }

    .wi-team-board {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 7px
    }

    .wi-team-tile {
        min-height: 126px;
        padding: 11px
    }

    .wi-team-tile:nth-child(1) {
        grid-column: span 2;
        min-height: 112px
    }

    .wi-team-tile:nth-child(1).has-people {
        display: grid;
        grid-template-columns: 1fr auto;
        grid-template-rows: auto 1fr auto
    }

    .wi-team-tile:nth-child(1).has-people .wi-team-top {
        grid-column: 1/-1
    }

    .wi-team-tile:nth-child(1).has-people .wi-team-name {
        margin-top: 8px
    }

    .wi-team-tile:nth-child(1).has-people strong {
        grid-column: 2;
        grid-row: 2/4;
        font-size: 42px
    }

    .wi-team-tile:nth-child(1).has-people .wi-team-people {
        grid-column: 1;
        grid-row: 4
    }

    .wi-team-tile:nth-child(1).has-people .wi-team-meta {
        grid-column: 1;
        grid-row: 3
    }

    .wi-team-name {
        font-size: 12px
    }

    .wi-team-tile strong {
        font-size: 24px
    }
}

@media(prefers-reduced-motion:reduce) {

    .wi-team-tile,
    .wi-team-tile.has-people .wi-team-signal {
        animation: none;
        transition: none
    }
}

/* Soft left-to-right neon wash for the four landing snapshot tiles */
.briefing-kpi {
    --kpi-neon: #62d2b3;
    background: linear-gradient(105deg, color-mix(in srgb, var(--kpi-neon), #101f22 89%) 0%, color-mix(in srgb, var(--kpi-neon), #101f22 95%) 34%, #101f22 78%);
    transition: transform .24s ease, border-color .24s ease, box-shadow .24s ease
}

.briefing-kpi.workforce {
    --kpi-neon: #5bd8b8
}

.briefing-kpi.positioning {
    --kpi-neon: #61c9f0
}

.briefing-kpi.safety {
    --kpi-neon: #ff8b78
}

.briefing-kpi.infrastructure {
    --kpi-neon: #b99aff
}

.briefing-kpi:before {
    z-index: 1;
    width: 3px;
    box-shadow: 0 0 13px color-mix(in srgb, var(--kpi-neon), transparent 12%)
}

.briefing-kpi:after {
    position: absolute;
    z-index: 0;
    inset: 0;
    background: linear-gradient(105deg, color-mix(in srgb, var(--kpi-neon), transparent 95%) 0%, color-mix(in srgb, var(--kpi-neon), transparent 98%) 38%, transparent 76%);
    content: "";
    pointer-events: none;
    transition: opacity .24s ease, filter .24s ease
}

.briefing-kpi>* {
    position: relative;
    z-index: 2
}

.briefing-kpi:hover {
    transform: translateY(-2px);
    border-color: color-mix(in srgb, var(--kpi-neon), #2b4142 48%);
    box-shadow: 0 12px 30px #0003, 0 0 22px color-mix(in srgb, var(--kpi-neon), transparent 94%)
}

.briefing-kpi:hover:after {
    filter: brightness(1.25)
}

.briefing-kpi.safety.has-alert {
    --kpi-neon: #ff655a;
    background: linear-gradient(100deg, #4a211f, #321d1d 38%, #151f21 84%)
}

.briefing-kpi.safety.has-alert:after {
    background: linear-gradient(100deg, #ff665a22, #ff665a0c 42%, transparent 78%)
}

@media(prefers-reduced-motion:reduce) {
    .briefing-kpi {
        transition: none
    }

    .briefing-kpi:hover {
        transform: none
    }
}

/* LATTICE operations console: restrained surfaces, one accent, clear status color. */
.operations-hub-standalone {
    --ops-bg: #0b1113;
    --ops-surface: #111a1d;
    --ops-raised: #172226;
    --ops-border: #ffffff12;
    --ops-border-strong: #ffffff1b;
    --ops-text: #edf3f2;
    --ops-muted: #a4b2b2;
    --ops-subtle: #819191;
    --ops-accent: #65cdb0;
    --ops-success: #69c69b;
    --ops-warning: #e7b864;
    --ops-danger: #f07c72;
    --ops-info: #7db8d7;
    background: var(--ops-bg);
    color: var(--ops-text);
    font-family: Inter, "DM Sans", ui-sans-serif, system-ui, sans-serif;
    font-size: 13px
}

.operations-hub {
    --bg: var(--ops-bg);
    --surface: var(--ops-surface);
    --surface-raised: var(--ops-raised);
    --line: var(--ops-border);
    --text: var(--ops-text);
    --muted: var(--ops-muted);
    --teal: var(--ops-accent);
    gap: 16px;
    max-width: none;
    padding: 0 32px 36px;
    color: var(--ops-text);
    font-size: 13px;
    font-variant-numeric: tabular-nums
}

.briefing-header {
    position: sticky;
    top: 0;
    z-index: 20;
    min-height: 64px;
    margin: 0;
    padding: 0 32px;
    border-bottom: 1px solid var(--ops-border);
    background: #0b1113df;
    backdrop-filter: blur(18px)
}

.briefing-brand,
.briefing-location {
    color: var(--ops-text)
}

.briefing-brand small,
.briefing-location small {
    color: var(--ops-muted)
}

.briefing-header-actions {
    gap: 12px
}

.briefing-user {
    background: var(--ops-raised);
    color: var(--ops-text)
}

.briefing-source {
    border-color: var(--ops-border);
    background: var(--ops-raised);
    color: var(--ops-muted);
    font-size: 12px;
    letter-spacing: 0
}

.briefing-source i {
    background: var(--ops-warning)
}

.briefing-source.is-live i {
    background: var(--ops-success);
    box-shadow: 0 0 0 0 #69c69b55;
    animation: ops-live-pulse 2.2s ease-out infinite
}

.briefing-source.is-demo i {
    background: var(--ops-info)
}

.briefing-hero {
    position: relative;
    display: block;
    min-height: 216px;
    overflow: hidden;
    border: 1px solid var(--ops-border-strong);
    border-radius: 12px;
    background: linear-gradient(120deg, #121c1f 0%, #101719 65%, #101719 100%);
    box-shadow: 0 12px 30px #0003
}

.briefing-hero-visual {
    position: absolute;
    inset: 0 0 0 auto;
    width: 53%;
    min-height: 0;
    opacity: .42;
    filter: saturate(.62) blur(.45px);
    mask-image: linear-gradient(90deg, transparent 0%, #000 34%, #000 100%);
    pointer-events: none
}

.briefing-hero-visual>img {
    object-position: 62% 53%;
    animation: briefing-photo-settle 34s ease-in-out infinite alternate
}

.briefing-photo-shade {
    background: linear-gradient(90deg, #10171922, transparent 60%), linear-gradient(0deg, #0b111340, transparent 52%)
}

.briefing-hero-content {
    position: relative;
    z-index: 3;
    display: flex;
    width: min(100%, 980px);
    min-height: 0;
    flex-direction: column;
    align-items: flex-start;
    justify-content: center;
    gap: 0;
    padding: 24px 30px
}

.briefing-date {
    gap: 12px;
    color: var(--ops-muted);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0;
    line-height: 1.4
}

.briefing-date .briefing-date-label {
    color: var(--ops-accent);
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0
}

.briefing-date time {
    color: var(--ops-muted)
}

.briefing-hero h1 {
    max-width: 740px;
    margin: 13px 0 5px;
    color: var(--ops-text);
    font-size: clamp(24px, 2.1vw, 28px);
    font-weight: 650;
    letter-spacing: -.035em;
    line-height: 1.18;
    text-transform: none;
    overflow-wrap: anywhere
}

.briefing-hero-content>.briefing-status-sentence {
    max-width: 720px;
    margin: 0;
    color: #cfdbd9;
    font-size: 14px;
    line-height: 1.5
}

.briefing-overview-link {
    min-height: 36px;
    gap: 10px;
    margin-top: 14px;
    padding: 8px 12px;
    border: 1px solid #65cdb04f;
    border-radius: 8px;
    background: #65cdb019;

    font-size: 13px;
    font-weight: 600;
    box-shadow: none

.briefing-overview-link:before {

    border-color: #65cdb099;
    background: #65cdb026

.briefing-overview-link>svg {
    color: var(--ops-accent)

.briefing-live-meta {
    display: flex;
    width: auto;
    flex-wrap: wrap;
    gap: 8px;

    padding: 0;
    border: 0;
    color: var(--ops-muted);
    font-size: 12px
}

.briefing-live-meta>span {
    display: flex;
    min-height: 30px;
    grid-template-columns: none;
    grid-template-rows: none;
    align-items: center;
    gap: 7px;
    padding: 5px 9px;
    border: 1px solid var(--ops-border);
    border-radius: 8px;
    background: #0b1214a8

.briefing-live-meta>span:first-child {
    padding-left: 9px
}

.briefing-live-meta>span:last-child {
    display: flex;
    border: 1px solid var(--ops-border)
}

.briefing-live-meta>span>i,
.briefing-live-meta>span>svg {
    grid-row: auto;
    grid-column: auto;
    flex: none

.briefing-live-meta>span>i {
    width: 7px;
    height: 7px;
    background: var(--ops-warning)
}

.briefing-live-meta>span>i.is-live {
    background: var(--ops-success);
    box-shadow: 0 0 0 0 #69c69b55;
    animation: ops-live-pulse 2.2s ease-out infinite
}

.briefing-live-meta>span>small {
    color: var(--ops-subtle);
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 0

.briefing-live-meta>span>b {
    max-width: 190px;
    color: #d4dfdd;
    font-size: 12px;
    font-weight: 550;
    white-space: nowrap
}

.briefing-actions {
    display: flex;
    min-height: 40px;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px;
    margin-top: -4px
}

.briefing-actions button {
    display: inline-flex;
    min-height: 36px;
    align-items: center;
    gap: 8px;
    padding: 7px 11px;
    border: 1px solid var(--ops-border);
    border-radius: 8px;
    background: var(--ops-surface);
    color: #d5dfdd;
    font-size: 12px;
    font-weight: 550;
    transition: background .18s, border-color .18s, transform .18s
}

.briefing-actions button:hover {
    transform: translateY(-1px);
    border-color: var(--ops-border-strong);
    background: var(--ops-raised)
}

.briefing-actions .action-issue {
    border-color: #65cdb04d;
    background: #65cdb015;

}

.briefing-actions .action-refresh {

}

.briefing-actions svg {
    color: var(--ops-accent)

.briefing-kpis {
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px
}

.briefing-kpi {

    min-width: 0;
    min-height: 142px;
    overflow: hidden;
    padding: 16px 18px;
    border: 1px solid var(--ops-border);
    border-radius: 12px;
    background: var(--ops-surface) !important;

    transition: transform .2s ease, border-color .2s ease, background .2s ease
}

.briefing-kpi:before {
    position: absolute;
    inset: 0 0 auto;
    height: 1px;
    background: #ffffff0a;
    content: ""
}

.briefing-kpi:hover {
    transform: translateY(-2px);
    border-color: var(--ops-border-strong);

}

.briefing-kpi>span {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--ops-muted);
    font-size: 12px;
    font-weight: 550;
    letter-spacing: 0;

.briefing-kpi>span svg {
    color: var(--ops-accent)
}

.briefing-kpi>strong {
    display: block;
    margin: 12px 0 0;
    color: var(--ops-text);
    font-size: 34px;
    font-weight: 650;
    letter-spacing: -.04em;
    line-height: 1;
    font-variant-numeric: tabular-nums

.briefing-kpi>strong small {
    color: var(--ops-muted);
    font-size: 18px;
    font-weight: 500

.briefing-kpi>b {
    display: block;
    margin-top: 7px;
    color: #dce5e3;
    font-size: 13px;
    font-weight: 550

.briefing-kpi>small {

    color: var(--ops-muted);

    line-height: 1.4

.briefing-kpi.safety.has-alert {

    background: linear-gradient(110deg, #f07c7216, transparent 70%) !important
}

.briefing-kpi.safety.has-alert>span svg,
.briefing-kpi.safety.has-alert>strong {
    color: var(--ops-danger)

.briefing-kpi.is-loading>i,
.briefing-kpi.is-loading>b,
.briefing-kpi.is-loading>small {
    display: block;
    border-radius: 5px;
    background: linear-gradient(90deg, #ffffff09 25%, #ffffff14 42%, #ffffff09 64%);

.briefing-kpi.is-loading>i {

.briefing-grid>.trend-card {

.briefing-grid>.workforce-card {

}

.briefing-grid>.tickets-card,
.briefing-grid>.shifts-card,
.briefing-grid>.anchors-card {

.briefing-grid>.zones-card {

.briefing-grid>.briefing-card:nth-child(3) {

}

.briefing-grid>.briefing-card:nth-child(4) {

}

.briefing-grid>.briefing-card:nth-child(5) {

.trend-chart {

.trend-gridline {

}

.trend-point {

}

.trend-foot {

.trend-y-axis,

.workforce-overview {

.briefing-ticket-row,

}

}

.briefing-setup-card {

    background: var(--ops-surface);

}

.setup-summary {
    display: flex;
    align-items: center;
    gap: 12px
}

.setup-icon {
    display: grid;
    width: 36px;
    height: 36px;
    flex: none;
    place-items: center;

    border-radius: 9px;
    background: #65cdb012;

.setup-summary p {

    font-size: 12px
}

.setup-summary>b {

}

    background: var(--ops-accent);

}

.setup-steps {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 8px
}

.setup-steps>button {
    display: flex;
    min-width: 0;
    min-height: 40px;
    align-items: center;
    gap: 8px;
    padding: 7px 9px;

    border-radius: 8px;
    background: #ffffff03;
    color: #d1dcda;
    text-align: left;
    font-size: 12px;
    cursor: pointer

.setup-steps>button:hover {
    border-color: var(--ops-border-strong);
    background: #ffffff08
}

.setup-steps>button>i {

    width: 20px;
    height: 20px;
    flex: none;
    place-items: center;
    border: 1px solid var(--ops-border-strong);
    border-radius: 50%;
    color: var(--ops-muted);
    font-size: 12px;
    font-style: normal
}

.setup-steps>button.is-complete>i {
    border-color: #69c69b50;
    color: var(--ops-success)
}

.setup-steps>button>span {
    min-width: 0;

}

.setup-steps>button>svg {
    color: var(--ops-subtle)

.setup-demo-note {
    display: flex;

.setup-demo-note button {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 0;
    background: none;
    color: var(--ops-accent);
    font-size: 12px;
    cursor: pointer
}

.briefing-footnote {
    color: var(--ops-muted);
    font-size: 12px
}

.briefing-footnote svg {
    color: var(--ops-accent)
}

.briefing-footnote>span:last-child {
    color: var(--ops-subtle);
    letter-spacing: 0;
    text-transform: none
}

.briefing-actions button:focus-visible,
.briefing-card button:focus-visible,
.briefing-kpi:focus-visible,
.setup-steps button:focus-visible,
.setup-demo-note button:focus-visible,

    --wi-raised: #172226;
    --wi-line: #ffffff14;
    --wi-text: #edf3f2;
    --wi-muted: #a4b2b2;
    --wi-accent: #65cdb0;
    min-height: 100vh;
    padding: 0 32px 36px;
    background: var(--wi-bg);
    color: var(--wi-text);
    font: 14px/1.45 Inter, "DM Sans", ui-sans-serif, system-ui, sans-serif;
    font-variant-numeric: tabular-nums
}

.workforce-intel-screen * {
    box-sizing: border-box
}

.workforce-intel-screen button,
.workforce-intel-screen input,
.workforce-intel-screen select {
    font: inherit
}

.workforce-intel-screen button {
    cursor: pointer
}

.workforce-intel-screen :focus-visible {
    outline: 2px solid var(--wi-accent);
    outline-offset: 2px
}

.workforce-intel-screen .wi-topbar {
    position: sticky;
    z-index: 20;
    top: 0;
    display: flex;
    justify-content: space-between;
    max-width: 1600px;
    min-height: 62px;
    margin: auto;
    padding: 0 4px;
    border-bottom: 1px solid var(--wi-line);
    background: #0b1113e8;
    backdrop-filter: blur(12px)
}

.workforce-intel-screen .wi-back {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 7px 10px;
    border: 0;
    background: transparent;
    color: var(--wi-muted);
    font-size: 13px;
    font-weight: 550
}

.workforce-intel-screen .wi-back svg {
    transform: rotate(180deg)
}

.workforce-intel-screen .wi-back:hover {
    color: var(--wi-text)
}

.workforce-intel-screen .wi-top-brand {
    position: absolute;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 12px;
    letter-spacing: .1em
}

.workforce-intel-screen .wi-top-brand img {
    width: 29px;
    height: 27px
}

.workforce-intel-screen .wi-top-brand small {
    margin-top: 2px;
    font-size: 12px;
    letter-spacing: .04em;
    color: var(--wi-muted)
}

.wi-live-state {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--wi-muted);
    font-size: 12px
}

.wi-live-state i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #e7b864
}

.wi-live-state.live i {
    background: #69c69b;
    box-shadow: 0 0 0 4px #69c69b18;
    animation: wi-pulse 2.4s infinite
}

.wi-live-state.sample i {
    background: #7db8d7
}

.workforce-intel-screen .wi-main {
    width: min(100%, 1540px);
    margin: 0 auto
}

.wi-page-header {
    padding: 23px 0 18px
}

.wi-crumb {
    margin-bottom: 8px;
    color: var(--wi-muted);
    font-size: 12px
}

.wi-crumb span {
    padding: 0 7px;
    color: #667576
}

.wi-page-title {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 24px
}

.wi-page-title h1 {
    margin: 0;
    font-size: 28px;
    line-height: 1.2;
    letter-spacing: -.035em;
    font-weight: 650
}

.wi-page-title p {
    margin: 5px 0 0;
    color: var(--wi-muted);
    font-size: 13px
}

.wi-header-actions {
    display: flex;
    align-items: center;
    gap: 8px
}

.wi-search {
    display: flex;
    align-items: center;
    gap: 8px;
    min-width: 225px;
    height: 36px;
    padding: 0 10px;
    border: 1px solid var(--wi-line);
    border-radius: 8px;
    background: var(--wi-surface);
    color: #819191
}

.wi-search input {
    width: 100%;
    border: 0;
    outline: 0;
    background: transparent;
    color: var(--wi-text);
    font-size: 12px
}

.wi-header-actions select {
    height: 36px;
    max-width: 170px;
    padding: 0 26px 0 10px;
    border: 1px solid var(--wi-line);
    border-radius: 8px;
    background: #111a1d;
    color: #c7d1d0;
    font-size: 12px
}

.wi-primary,
.wi-secondary,
.wi-ghost {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    min-height: 36px;
    padding: 0 12px;
    border: 1px solid var(--wi-line);
    border-radius: 8px;
    background: #172226;
    color: var(--wi-text);
    font-size: 12px;
    font-weight: 600;
    transition: background .2s, border-color .2s, transform .2s
}

.wi-primary {
    border-color: #65cdb055;
    background: #65cdb01a;
    color: #a7ead5
}

.wi-primary:hover,
.wi-secondary:hover,
.wi-ghost:hover {
    transform: translateY(-1px);
    border-color: #65cdb077;
    background: #1b2a2d
}

.wi-sample-banner {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin: 0 0 12px;
    padding: 10px 14px;
    border: 1px solid #7db8d744;
    border-radius: 9px;
    background: #7db8d70d;
    color: #bdd7e3;
    font-size: 12px
}

.wi-sample-banner span {
    display: flex;
    align-items: center;
    gap: 8px
}

.wi-sample-banner i {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #7db8d7
}

.wi-sample-banner button {
    border: 0;
    background: transparent;
    color: #c2e0eb
}

.wi-insights {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    margin-bottom: 14px
}

.wi-insight,
.wi-panel {
    position: relative;
    border: 1px solid var(--wi-line);
    border-radius: 12px;
    background: linear-gradient(180deg, #ffffff05, transparent 28px), var(--wi-surface);
    box-shadow: inset 0 1px #ffffff08, 0 8px 24px #00000012
}

.wi-insight {
    min-height: 112px;
    padding: 14px 16px
}

.wi-insight>span {
    display: block;
    color: var(--wi-muted);
    font-size: 12px
}

.wi-insight strong {
    display: block;
    margin-top: 3px;
    font-size: 30px;
    line-height: 1.16;
    font-weight: 650;
    letter-spacing: -.04em
}

.wi-insight small {
    display: block;
    margin-top: 4px;
    color: #8fa09f;
    font-size: 12px
}

.wi-progress {
    height: 3px;
    margin-top: 9px;
    overflow: hidden;
    border-radius: 5px;
    background: #ffffff12
}

.wi-progress i {
    display: block;
    height: 100%;
    border-radius: inherit;
    background: var(--wi-accent);
    transition: width .4s
}

.wi-panel {
    padding: 18px;
    margin-bottom: 14px
}

.wi-panel-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 15px
}

.wi-panel-head h2 {
    margin: 0;
    font-size: 16px;
    font-weight: 620;
    letter-spacing: -.02em
}

.wi-panel-head p {
    margin: 4px 0 0;
    color: var(--wi-muted);
    font-size: 12px
}

.wi-toggle {
    display: flex;
    padding: 3px;
    border: 1px solid var(--wi-line);
    border-radius: 8px;
    background: #0c1416
}

.wi-toggle button {
    padding: 5px 10px;
    border: 0;
    border-radius: 6px;
    background: transparent;
    color: var(--wi-muted);
    font-size: 12px
}

.wi-toggle button.active {
    background: #273536;
    color: var(--wi-text);
    box-shadow: inset 0 1px #ffffff0c
}

.wi-composition-layout {
    display: grid;
    grid-template-columns: minmax(300px, .85fr) minmax(420px, 1.15fr);
    align-items: center;
    gap: 28px;
    min-height: 275px;
    padding: 8px 5px
}

.wi-visual-wrap {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 250px
}

.wi-donut {
    position: relative;
    width: 216px;
    height: 216px
}

.wi-donut svg {
    width: 100%;
    height: 100%;
    overflow: visible
}

.wi-donut-track {
    fill: none;
    stroke: #ffffff0b;
    stroke-width: 20
}

.wi-donut-segment {
    cursor: pointer;
    transition: stroke-width .2s, opacity .2s, filter .2s;
    transform-box: fill-box;
    transform-origin: center;
    animation: wi-segment-enter .65s cubic-bezier(.2, .7, .2, 1) both
}

.wi-donut-segment:hover,
.wi-donut-segment:focus {
    filter: drop-shadow(0 0 5px currentColor);
    stroke-width: 25
}

.wi-donut-segment.dimmed {
    opacity: .32
}

.wi-donut-center {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    pointer-events: none
}

.wi-donut-center b {
    font-size: 40px;
    font-weight: 650;
    line-height: 1;
    letter-spacing: -.05em
}

.wi-donut-center span {
    margin-top: 7px;
    color: var(--wi-muted);
    font-size: 12px
}

.wi-chart-tooltip {
    position: absolute;
    bottom: 0;
    padding: 6px 9px;
    border: 1px solid var(--wi-line);
    border-radius: 7px;
    background: #172226;
    color: #dbe6e3;
    font-size: 12px;
    box-shadow: 0 5px 18px #0005
}

.wi-ranked-legend {
    display: flex;
    flex-direction: column;
    gap: 3px
}

.wi-legend-row {
    display: grid;
    grid-template-columns: minmax(142px, 1.05fr) minmax(80px, 1.2fr) 38px 34px;
    align-items: center;
    gap: 12px;
    min-height: 31px;
    padding: 4px 7px;
    border: 1px solid transparent;
    border-radius: 7px;
    background: transparent;
    color: #c2cecb;
    text-align: left;
    transition: background .2s, border-color .2s
}

.wi-legend-row:hover,
.wi-legend-row.hovered {
    background: #ffffff08
}

.wi-legend-row.selected {
    border-color: #65cdb060;
    background: #65cdb00d
}

.wi-legend-label {
    display: flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
    font-size: 12px
}

.wi-legend-label i {
    width: 8px;
    height: 8px;
    flex: none;
    border-radius: 50%
}

.wi-legend-bar {
    height: 4px;
    overflow: hidden;
    border-radius: 5px;
    background: #ffffff12
}

.wi-legend-bar i {
    display: block;
    height: 100%;
    border-radius: inherit;
    transition: width .5s cubic-bezier(.2, .7, .2, 1)
}

.wi-legend-row>b {
    text-align: right;
    font-size: 12px;
    font-weight: 600
}

.wi-legend-row>small {
    text-align: right;
    color: var(--wi-muted);
    font-size: 12px
}

.wi-show-categories {
    align-self: flex-start;
    margin: 4px 0 0 25px;
    border: 0;
    background: transparent;
    color: #8ddbc4;
    font-size: 12px
}

.wi-treemap {
    display: flex;
    flex-wrap: wrap;
    gap: 7px;
    width: 100%;
    max-width: 470px
}

.wi-treemap button {
    display: flex;
    flex: 1 1 120px;
    flex-direction: column;
    justify-content: center;
    gap: 5px;
    min-width: 115px;
    min-height: 82px;
    padding: 10px;
    border: 1px solid;
    border-radius: 8px;
    color: var(--wi-text);
    text-align: left;
    transition: transform .2s
}

.wi-treemap button:hover {
    transform: translateY(-2px)
}

.wi-treemap button>i {
    width: 7px;
    height: 7px;
    border-radius: 50%
}

.wi-treemap button>b {
    font-size: 12px
}

.wi-treemap button>span {
    color: #b5c2c0;
    font-size: 12px
}

.wi-bars {
    width: min(100%, 490px);
    display: flex;
    flex-direction: column;
    gap: 10px
}

.wi-bars button {
    display: grid;
    grid-template-columns: 150px 1fr 30px;
    gap: 10px;
    align-items: center;
    border: 0;
    background: transparent;
    color: #c2cecb;
    text-align: left
}

.wi-bars button>span {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 12px
}

.wi-bars button>span i {
    width: 7px;
    height: 7px;
    border-radius: 50%
}

.wi-bars button>div {
    height: 8px;
    border-radius: 6px;
    background: #ffffff10
}

.wi-bars button>div i {
    display: block;
    height: 100%;
    border-radius: 6px;
    transition: width .4s
}

.wi-bars button>b {
    text-align: right;
    font-size: 12px
}

.wi-empty-composition {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 32px;
    min-height: 270px
}

.wi-empty-donut {
    width: 168px;
    height: 168px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 18px solid #ffffff0c;
    border-radius: 50%;
    color: #768482
}

.wi-empty-donut b {
    font-size: 32px
}

.wi-empty-donut span {
    font-size: 12px
}

.wi-empty-composition h3 {
    margin: 0 0 5px;
    font-size: 16px
}

.wi-empty-composition p {
    max-width: 450px;
    margin: 0;
    color: var(--wi-muted);
    font-size: 12px
}

.wi-empty-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px
}

.wi-skeleton {
    display: block;
    width: 62%;
    height: 32px;
    margin-top: 6px;
    border-radius: 6px;
    background: linear-gradient(90deg, #ffffff08, #ffffff16, #ffffff08);
    background-size: 200% 100%;
    animation: wi-shimmer 1.4s infinite
}

.wi-loading-layout {
    opacity: .65
}

.wi-donut-skeleton {
    width: 194px;
    height: 194px;
    border: 20px solid #ffffff0a;
    border-top-color: #ffffff18;
    border-radius: 50%;
    animation: wi-spin 1.4s linear infinite
}

.wi-role-skeleton {
    display: grid;
    gap: 13px
}

.wi-role-skeleton i {
    display: block;
    width: min(100%, 470px);
    height: 8px;
    border-radius: 8px;
    background: linear-gradient(90deg, #ffffff08, #ffffff16, #ffffff08);
    background-size: 200% 100%;
    animation: wi-shimmer 1.4s infinite
}

.wi-register-panel {
    padding-bottom: 10px
}

.wi-ghost {
    min-height: 32px;
    background: transparent;
    color: var(--wi-muted);
    font-size: 12px
}

.wi-table-scroll {
    max-height: 510px;
    overflow: auto;
    border: 1px solid var(--wi-line);
    border-radius: 8px
}

.wi-roster-table {
    width: 100%;
    border-collapse: separate;
    border-spacing: 0;
    font-size: 12px
}

.wi-roster-table th {
    position: sticky;
    z-index: 2;
    top: 0;
    padding: 10px 12px;
    border-bottom: 1px solid var(--wi-line);
    background: #141e20;
    color: #9baead;
    font-size: 12px;
    font-weight: 550;
    text-align: left;
    white-space: nowrap
}

.wi-roster-table td {
    height: 43px;
    padding: 8px 12px;
    border-bottom: 1px solid #ffffff0a;
    color: #c5cfcd;
    white-space: nowrap
}

.wi-roster-table tbody tr:last-child td {
    border-bottom: 0
}

.wi-roster-table tbody tr:not(.wi-skeleton-row):hover {
    background: #ffffff06
}

.wi-roster-table td:first-child b {
    color: #ecf3f1;
    font-weight: 550
}

.wi-badge-id {
    padding: 3px 6px;
    border: 1px solid var(--wi-line);
    border-radius: 5px;
    color: #a8bfba;
    font-size: 12px
}

.battery-low {
    color: #e7b864
}

.wi-status-chip {
    display: inline-flex;
    align-items: center;
    padding: 3px 7px;
    border-radius: 99px;
    background: #ffffff0c;
    color: #b3c0be;
    font-size: 12px
}

.wi-status-chip.online {
    background: #69c69b14;
    color: #8dd8af
}

.wi-status-chip.stale {
    background: #e7b86414;
    color: #e8c578
}

.wi-status-chip.offline {
    background: #f07c7214;
    color: #f0978e
}

.wi-table-empty {
    text-align: center !important;
    color: var(--wi-muted) !important;
    height: 92px !important
}

.wi-skeleton-row td i {
    display: block;
    height: 20px;
    border-radius: 5px;
    background: linear-gradient(90deg, #ffffff08, #ffffff15, #ffffff08);
    background-size: 200% 100%;
    animation: wi-shimmer 1.4s infinite
}

.wi-pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 2px 1px;
    color: var(--wi-muted);
    font-size: 12px
}

.wi-pagination>div {
    display: flex;
    align-items: center;
    gap: 10px
}

.wi-pagination button {
    padding: 5px 8px;
    border: 1px solid var(--wi-line);
    border-radius: 6px;
    background: #172226;
    color: #c0ccca;
    font-size: 12px
}

.wi-pagination button:disabled {
    opacity: .4;
    cursor: default
}

.wi-bottom-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px
}

.wi-bottom-grid .wi-panel {
    height: 100%;
    margin: 0
}

.wi-coverage-row {
    display: grid;
    grid-template-columns: 9px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 11px 2px;
    border-bottom: 1px solid #ffffff0b
}

.wi-coverage-row:last-of-type {
    border: 0
}

.wi-coverage-row>i {
    width: 7px;
    height: 7px;
    border-radius: 50%
}

.wi-coverage-row span {
    color: #c1ceca;
    font-size: 12px
}

.wi-coverage-row b {
    font-size: 14px;
    font-weight: 600
}

.wi-note {
    display: block;
    margin-top: 8px;
    color: var(--wi-muted);
    font-size: 12px
}

.wi-shift-readiness {
    display: flex;
    flex-direction: column;
    gap: 13px
}

.wi-shift-readiness>div {
    display: grid;
    grid-template-columns: 130px minmax(80px, 1fr) 54px;
    align-items: center;
    gap: 12px;
    color: #bdc9c7;
    font-size: 12px
}

.wi-shift-readiness>div>div {
    height: 7px;
    border-radius: 6px;
    background: #ffffff10
}

.wi-shift-readiness>div>div i {
    display: block;
    height: 100%;
    border-radius: 6px
}

.wi-shift-readiness b {
    text-align: right;
    color: var(--wi-text);
    font-weight: 550
}

.wi-shift-readiness b small {
    color: var(--wi-muted);
    font-size: 12px
}

.wi-shift-empty {
    display: flex;
    align-items: center;
    gap: 10px;
    min-height: 110px;
    color: var(--wi-muted);
    font-size: 12px
}

.wi-shift-empty svg {
    color: #889997
}

.wi-shift-empty button {
    margin-left: auto;
    padding: 7px 10px;
    border: 1px solid var(--wi-line);
    border-radius: 7px;
    background: #172226;
    color: #cfe5dd;
    font-size: 12px
}

.workforce-intel-screen .wi-footer {
    display: flex;
    justify-content: space-between;
    margin-top: 14px;
    padding: 11px 0;
    color: var(--wi-muted);
    font-size: 12px
}

.workforce-intel-screen .wi-footer span {
    display: flex;
    align-items: center;
    gap: 7px
}

.workforce-intel-screen .wi-footer button {
    display: flex;
    align-items: center;
    gap: 6px;
    border: 0;
    background: transparent;
    color: #a9c5bc;
    font-size: 12px
}

@keyframes wi-pulse {
    50% {
        box-shadow: 0 0 0 7px #69c69b08
    }
}

@keyframes wi-shimmer {
    to {
        background-position: -200% 0
    }
}

@keyframes wi-spin {
    to {
        transform: rotate(360deg)
    }
}

@keyframes wi-segment-enter {
    from {
        opacity: .15;
        stroke-dasharray: 0 478
    }

    to {
        opacity: 1
    }
}

@media(max-width:1120px) {
    .workforce-intel-screen {
        padding-inline: 20px
    }

    .wi-page-title {
        align-items: flex-start;
        flex-direction: column
    }

    .wi-header-actions {
        flex-wrap: wrap;
        width: 100%
    }

    .wi-insights {
        gap: 8px
    }

    .wi-composition-layout {
        grid-template-columns: minmax(250px, .8fr) minmax(380px, 1.2fr);
        gap: 16px
    }

    .wi-legend-row {
        grid-template-columns: minmax(125px, 1fr) minmax(70px, 1fr) 32px 30px;
        gap: 8px
    }
}

@media(max-width:760px) {
    .workforce-intel-screen {
        padding: 0 14px 24px
    }

    .workforce-intel-screen .wi-topbar {
        min-height: 56px
    }

    .workforce-intel-screen .wi-top-brand {
        display: none
    }

    .wi-page-header {
        padding-top: 18px
    }

    .wi-header-actions {
        display: grid;
        grid-template-columns: 1fr 1fr
    }

    .wi-header-actions .wi-search {
        grid-column: 1/-1;
        min-width: 0
    }

    .wi-header-actions select {
        max-width: none;
        width: 100%
    }

    .wi-header-actions button {
        width: 100%

/* Keep the SVG chart, its segments and center label in the same coordinate box. */
.wi-composition-layout {
    align-items: center;
    min-height: 340px
}

.wi-visual-wrap {
    position: relative;
    display: grid;
    place-items: center;
    min-width: 0;
    min-height: 340px;
    overflow: visible
}

.wi-donut {
    position: relative;
    display: block;
    flex: none;
    width: 280px;
    height: 280px;
    aspect-ratio: 1;
    margin: auto;
    overflow: visible;
    border-radius: 0;
    background: none;
    box-shadow: none;
    animation: none
}

.wi-donut>svg {
    position: absolute;
    inset: 0;
    display: block;
    width: 100%;
    height: 100%;
    overflow: visible
}

.wi-donut-center {
    position: absolute !important;
    inset: 0 !important;
    z-index: 2;
    display: grid !important;
    place-items: center;
    align-content: center;
    text-align: center !important;
    pointer-events: none
}

.wi-donut-center>b {
    display: block;
    color: var(--wi-text);
    font-size: 40px;
    line-height: 1;
    font-weight: 650
}

.wi-donut-center>span {
    display: block;
    margin-top: 7px;
    color: var(--wi-muted);
    font-size: 13px;
    line-height: 1.2
}

.wi-donut-track {
    fill: none;
    stroke: rgba(255, 255, 255, .07);
    stroke-width: 12
}

.wi-donut-segments {
    transform: none;
    transform-box: none;
    transform-origin: initial
}

.wi-donut-segment {
    fill: none;
    stroke-linecap: butt;
    cursor: pointer;
    stroke-dashoffset: var(--dash-offset);
    animation: wi-segment-sweep .72s cubic-bezier(.2, .7, .2, 1) var(--segment-delay) both;
    transition: opacity .18s;
    transform: none
}

.wi-donut-segment.dimmed {
    opacity: .22
}

.wi-chart-tooltip {
    bottom: 3px
}

@keyframes wi-segment-sweep {
    from {
        stroke-dashoffset: 0
    }

    to {
        stroke-dashoffset: var(--dash-offset)
    }
}

@media(max-width:760px) {
    .wi-composition-layout {
        grid-template-columns: 1fr;
        gap: 14px
    }

    .wi-visual-wrap {
        min-height: 320px
    }

    .wi-donut {
        width: min(280px, 100%);
        height: auto
    }
}

   ========================================================================== */

.operations-hub-standalone[data-theme="light"]:has(> .operations-hub),

  /* Frosted Glass System */
  --glass-bg: linear-gradient(135deg, rgba(255, 255, 255, 0.65) 0%, rgba(240, 252, 250, 0.42) 50%, rgba(247, 243, 255, 0.48) 100%);
  --glass-bg-hover: linear-gradient(135deg, rgba(255, 255, 255, 0.78) 0%, rgba(240, 252, 250, 0.54) 50%, rgba(247, 243, 255, 0.60) 100%);
  --glass-sub: rgba(255, 255, 255, 0.52);
  --glass-sub-hover: rgba(255, 255, 255, 0.72);
  --glass-border: rgba(255, 255, 255, 0.82);
  --glass-border-strong: rgba(255, 255, 255, 0.94);
  --glass-shadow: inset 0 1.5px 1px 0 rgba(255, 255, 255, 0.95), inset 0 -1px 1px 0 rgba(255, 255, 255, 0.2), 0 16px 36px rgba(10, 45, 67, 0.08), 0 2px 8px rgba(0, 0, 0, 0.03);
  --glass-shadow-hover: inset 0 1.5px 1px 0 rgba(255, 255, 255, 1), 0 22px 46px rgba(10, 45, 67, 0.13), 0 0 24px rgba(86, 255, 164, 0.22);
  --glass-blur: blur(24px) saturate(190%) brightness(1.04);

  /* Smooth Aurora Skies Canvas: Pure organic frosted glass glows with no grid or line artifacts */
  background:
    /* Radiant White-Lavender Luminous Core */
    radial-gradient(ellipse 70% 60% at 50% 22%, rgba(255, 255, 255, 0.9) 0%, rgba(240, 248, 255, 0.68) 28%, rgba(210, 235, 255, 0.35) 60%, transparent 82%),
    /* Top-Left: Neon Mint / Aurora Emerald Field */
    radial-gradient(ellipse 75% 65% at 0% 0%, #56FFA4 0%, rgba(86, 255, 164, 0.75) 34%, rgba(86, 255, 164, 0.28) 65%, transparent 85%),
    /* Top-Right: Ethereal Lavender Violet Cloud */

    /* Bottom-Right: Ice Cyan / Sky Blue Field */

    /* Bottom-Left: Deep Aurora Pine Teal Base */
    radial-gradient(ellipse 72% 62% at 0% 100%, #0A2D43 0%, #157A6E 40%, rgba(21, 122, 110, 0.38) 72%, transparent 88%),
    /* Base Chromatic Glow */
    linear-gradient(135deg, #7BE495 0%, #B084FF 50%, #79C7FF 100%) !important;
